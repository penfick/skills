[project]
name = "pptx-penfick"
version = "0.8.0"
description = "JSON outline to PPTX renderer with CJK support and structural QA"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0.2",
    "lxml>=5.0",
    "pillow>=10.0",
]

[project.scripts]
pptx-penfick = "pptskill.cli:main"
pptskill = "pptskill.cli:main"
pptskill-mcp = "pptskill.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pptskill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
